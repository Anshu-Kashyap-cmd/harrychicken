# Netlify Configuration for Harry's Chicken Web Application
[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) redirect rule
# Ensures all routes, direct links, and refreshes load index.html without 404 errors
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
